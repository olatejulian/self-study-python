[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pyright>=1.1.403",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.3",
  "ruff>=0.12.5",
  "toml-sort>=0.23.1",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["omni"]

[tool.mypy]
disable_error_code = "import-untyped"
strict = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["integration: integration tests", "slow: slow tests"]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "test_*.py"]
python_functions = ["test_*"]
timeout = 10
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv.workspace]
members = ["omni/*"]
