[dependency-groups]
dev = ["mypy>=1.17.0", "pyright>=1.1.403", "ruff>=0.12.5", "toml-sort>=0.23.1"]

[project]
authors = [{ email = "julian.lf.olate@gmail.com", name = "olatejulian" }]
dependencies = []
description = "A monorepo designed for learning and practicing Python programming"
license = { text = "MIT" }
name = "pyomnirepo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "0.0.0"

[tool.mypy]
disable_error_code = "import-untyped"

[tool.ruff.lint]
extend-select = ["E501"]
select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.uv.workspace]
members = ["pyomnirepo/*"]
