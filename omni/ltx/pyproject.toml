[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ email = "julian.lf.olate@gmail.com", name = "olatejulian" }]
dependencies = [
  "dependency-injector>=4.42.0",
  "pydantic>=2.9.2",
  "typer>=0.12.5",
]
description = "cli for make latex building easier"
license = { text = "MIT" }
name = "ltx"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]
