[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "beautifulsoup4>=4.12.2",
  "httpx>=0.24.1",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "pytest>=7.4.0",
  "python-semantic-release>=7.34.3",
  "types-passlib>=1.7.7.12",
  "watchdog>=3.0.0",
]

[project]
authors = [{ email = "julian.lf.olate@gmail.com", name = "olatejulian" }]
dependencies = [
  "aiosmtplib>=2.0.2",
  "beanie>=1.17.0",
  "email-validator>=2.0.0.post2",
  "fastapi>=0.95.1",
  "flower>=2.0.0",
  "jinja2>=3.1.2",
  "motor>=3.1.1",
  "passlib[bcrypt]>=1.7.4",
  "pendulum>=2.1.2",
  "pydantic>=1.10.7",
  "python-dotenv>=1.0.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.6",
  "uvicorn>=0.22.0",
]
description = "A simple example of a Python API using FastAPI and Beanie"
license = { text = "MIT" }
name = "aegispy"
requires-python = ">=3.12,<3.13"
version = "0.0.0"

[tool.commitizen]
major_version_zero = true
name = "cz_conventional_commits"
tag_format = "$version"
update_changelog_on_bump = true
version_provider = "pep621"
version_type = "semver"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.semantic_release]
branch = "release"
command = "pdm run cz bump --check-consistency"
commit_message = "build(release): :bookmark: {version}"
commit_version_number = true
upload_to_pypi = false
upload_to_release = true
upload_to_repository = false
version_source = "tag"
version_variable = [
  "pyproject.toml:project.version",
  "src.__init__.py:__version__",
]
