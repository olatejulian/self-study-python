[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = ["pyinstaller>=4.5.1"]

[project]
dependencies = ["pathspec>=1.1.1", "typer>=0.25.1"]
description = "A simple markdown packager"
name = "mdpack"
requires-python = ">=3.12,<3.13"
version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]
