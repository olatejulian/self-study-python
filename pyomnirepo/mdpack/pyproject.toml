[dependency-groups]
dev = [
  "mypy>=1.19.1",
  "pyinstaller>=4.5.1",
  "pytest-cov>=7.1.0",
  "pytest>=9.0.3",
  "ruff>=0.14.10",
]

[project]
dependencies = ["pathspec>=1.1.1", "typer>=0.25.1"]
description = "A simple markdown packager"
name = "mdpack"
requires-python = ">=3.12,<3.13"
version = "0.0.0"

[tool.ruff.lint]
select = ["I"]

# for binary generation use: uv run pyinstaller --clean -Fn mdpack -y src/mdpack/main.py
